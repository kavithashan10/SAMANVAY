name: UI preview (temporary)
on:
  push:
    branches: ['preview/**']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare project
        run: |
          flutter create --project-name samanvay --org org.samanvay --platforms android /tmp/s
          cp /tmp/s/pubspec.yaml /tmp/s/analysis_options.yaml .
          mkdir -p lib/src test assets
          cp app/*.dart lib/
          cp -R app/src/. lib/src/
          cp -R app/assets/. assets/
          cp tools/ui_preview/ui_preview_test.dart test/
          flutter pub add supabase_flutter:2.18.3 maplibre_gl:0.27.1 latlong2 google_fonts flutter_svg url_launcher file_picker geolocator image_picker csv permission_handler:12.0.3 http crypto:3.0.8 shared_preferences
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('pubspec.yaml'); c = p.read_text()
          c += '\ndependency_overrides:\n  permission_handler_android: 13.0.1\n'
          dirs = sorted({str(Path(r)) + '/' for r, _, f in os.walk('assets') if f})
          c = c.replace('\nflutter:\n', '\nflutter:\n  assets:\n' + ''.join(f'    - {d}\n' for d in dirs), 1)
          p.write_text(c)
          PY
          flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
      - name: Screens
        run: flutter test test/ui_preview_test.dart --reporter expanded > test_log.txt 2>&1 || true
      - name: Commit preview images
        if: always()
        run: |
          mkdir -p tools/ui_preview/out
          cp preview/* analyze.txt test_log.txt tools/ui_preview/out/ 2>/dev/null || true
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add -f tools/ui_preview/out
          git commit -m "UI preview [skip ci]" || exit 0
          git push -f origin HEAD:${GITHUB_REF_NAME}
