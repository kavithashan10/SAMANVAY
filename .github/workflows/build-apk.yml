


name: Build SAMANVAY Android APK
# Rebuild final reference assets and splash/locator transition from latest app code.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/alpha-03-integrated-platform
      - 'claude/**'
    paths:
      - 'app/**'
      - '!app/assets/brand/*.part*'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: samanvay-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Diagnose and Publish APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Generate Android project
      - name: Generate Android project
        run: |
          flutter create \
            --project-name samanvay \
            --org org.samanvay \
            --platforms android \
            /tmp/samanvay_scaffold

          cp -R /tmp/samanvay_scaffold/android .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """
          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Android application tag not found")

              content = content.replace(
                  "<application",
                  permissions + "\n    <application",
                  1,
              )
          deep_link_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="in.samanvay"
                          android:host="login-callback" />
                  </intent-filter>
          """

          if "android:host=\"login-callback\"" not in content:
              content = content.replace(
                  "</activity>",
                  deep_link_filter + "\n        </activity>",
                  1,
              )
          manifest.write_text(content)
          PY

          # Verify the generated Android namespace and application ID.
          if [ -f android/app/build.gradle.kts ]; then
            grep -Eq 'namespace[[:space:]]*=[[:space:]]*"org.samanvay.samanvay"' android/app/build.gradle.kts || {
              echo "ERROR: Android namespace is not org.samanvay.samanvay."
              exit 1
            }
            grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"org.samanvay.samanvay"' android/app/build.gradle.kts || {
              echo "ERROR: Android applicationId is not org.samanvay.samanvay."
              exit 1
            }
          elif [ -f android/app/build.gradle ]; then
            (grep -Eq "namespace[[:space:]]*=[[:space:]]*['\"]org.samanvay.samanvay['\"]" android/app/build.gradle ||
              grep -Eq "namespace[[:space:]]+'org.samanvay.samanvay'" android/app/build.gradle) || {
              echo "ERROR: Android namespace is not org.samanvay.samanvay."
              exit 1
            }
            (grep -Eq "applicationId[[:space:]]*=[[:space:]]*['\"]org.samanvay.samanvay['\"]" android/app/build.gradle ||
              grep -Eq "applicationId[[:space:]]+'org.samanvay.samanvay'" android/app/build.gradle) || {
              echo "ERROR: Android applicationId is not org.samanvay.samanvay."
              exit 1
            }
          else
            echo "ERROR: Android app Gradle file was not generated."
            exit 1
          fi
          echo "PASS: Android namespace and applicationId verified."

          # Launcher icon and native launch screen from the SAMANVAY logo.
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter

          logo_path = Path('app/assets/brand/samanvay_logo.png')
          if not logo_path.is_file():
              raise SystemExit('ERROR: SAMANVAY logo PNG is missing.')
          logo = Image.open(logo_path).convert('RGBA')
          if logo.width != logo.height or logo.width < 512:
              raise SystemExit(f'ERROR: SAMANVAY logo must be square and at least 512 px, got {logo.size}.')
          # The artwork without the rounded frame, for the adaptive icon.
          inset = round(logo.width * .058)
          art = logo.crop((inset, inset, logo.width - inset, logo.height - inset)).convert('RGB')
          navy = (8, 22, 76, 255)
          res = Path('android/app/src/main/res')

          # Legacy icons: the full rounded logo.
          for density, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = logo.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png')
              icon.save(folder / 'ic_launcher_round.png')

          # Adaptive icon (Android 8+): the artwork fills the 72dp visible area of a 108dp canvas.
          drawable = res / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          # Background: the artwork itself, blurred, so there is no seam.
          art.resize((432, 432), Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(28)).save(drawable / 'ic_launcher_backdrop.png')
          # Foreground: the artwork with feathered edges.
          size = 312
          feather = Image.new('L', (size, size), 0)
          ImageDraw.Draw(feather).rounded_rectangle((10, 10, size - 11, size - 11), radius=60, fill=255)
          feather = feather.filter(ImageFilter.GaussianBlur(9))
          piece = art.resize((size, size), Image.Resampling.LANCZOS).convert('RGBA')
          piece.putalpha(feather)
          fg = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          fg.alpha_composite(piece, ((432 - size) // 2, (432 - size) // 2))
          fg.save(drawable / 'ic_launcher_foreground.png')
          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'ic_launcher_background.xml').write_text('<resources><color name="ic_launcher_background">#08164C</color><color name="samanvay_splash">#030B24</color></resources>')
          adaptive = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_backdrop"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>'
          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / 'ic_launcher.xml').write_text(adaptive)
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive)

          # Native launch screen: night blue with the logo, so the app opens
          # straight into the animated splash without a white flash.
          nodpi = res / 'drawable-nodpi'
          nodpi.mkdir(parents=True, exist_ok=True)
          logo.resize((288, 288), Image.Resampling.LANCZOS).save(nodpi / 'splash_logo.png')
          launch = ('<?xml version="1.0" encoding="utf-8"?>'
                    '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">'
                    '<item android:drawable="@color/samanvay_splash"/>'
                    '<item android:width="144dp" android:height="144dp" android:gravity="center" android:drawable="@drawable/splash_logo"/>'
                    '</layer-list>')
          for folder in ('drawable', 'drawable-v21'):
              (res / folder).mkdir(parents=True, exist_ok=True)
              (res / folder / 'launch_background.xml').write_text(launch)
          # Android 12+ system splash: same colour, the app icon in the middle.
          v31 = res / 'values-v31'
          v31.mkdir(parents=True, exist_ok=True)
          splash_items = ('<item name="android:windowSplashScreenBackground">@color/samanvay_splash</item>'
                          '<item name="android:windowSplashScreenIconBackgroundColor">@color/samanvay_splash</item>')
          (v31 / 'styles.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?><resources>'
              '<style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">'
              '<item name="android:windowBackground">@drawable/launch_background</item>' + splash_items + '</style>'
              '<style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">'
              '<item name="android:windowBackground">@color/samanvay_splash</item></style>'
              '</resources>')
          night31 = res / 'values-night-v31'
          if night31.exists():
              (night31 / 'styles.xml').write_text((v31 / 'styles.xml').read_text())
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(manifest.read_text().replace('android:label="samanvay"', 'android:label="SAMANVAY"'))
          print('PASS: launcher icon, adaptive icon and launch screen generated from the SAMANVAY logo.')
          PY

          cp /tmp/samanvay_scaffold/pubspec.yaml .
          cp /tmp/samanvay_scaffold/analysis_options.yaml .
          cp /tmp/samanvay_scaffold/.metadata .

          mkdir -p lib assets/reference/coimbatore assets/brand
          if [ ! -d app/assets/reference ]; then
            echo "ERROR: Source GIS reference directory app/assets/reference is missing."
            exit 1
          fi
          cp -R app/assets/reference/. assets/reference/
          cp -R app/assets/brand/. assets/brand/
          mkdir -p assets/cutaway && cp -R app/assets/cutaway/. assets/cutaway/
          test -s assets/cutaway/three.min.js
          test -s assets/cutaway/index.html
          test -s assets/brand/samanvay_logo.png
          # Copy every app module so new pages are never left out of the build.
          cp app/*.dart lib/
          mkdir -p lib/src && cp -R app/src/. lib/src/

          if [ ! -s assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson ]; then
            echo "ERROR: Coimbatore ward reference GeoJSON is missing from the repository."
            exit 1
          fi

          if [ ! -s assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson ]; then
            echo "ERROR: Coimbatore groundwater telemetry GeoJSON is missing from the repository."
            exit 1
          fi
          test -s assets/brand/samanvay_logo.jpg
          test -s assets/brand/home_city_banner.jpg
          test -s assets/brand/profile_avatar.jpg
          test -s assets/brand/profile_footer.jpg
          test -s assets/brand/splash_city.jpg
          test -s assets/brand/samanvay_city_background.svg
          test -s assets/brand/samanvay_home_banner.svg
          test -s assets/brand/samanvay_profile_footer.svg
          test -s assets/brand/samanvay_logo.svg
          test -s assets/brand/samanvay_profile_avatar.svg
          test -s lib/public_transparency_dashboard_page.dart
          test -s lib/samanvay_ai_chat_page.dart

      # 5. Install dependencies
      - name: Install Flutter dependencies
        run: |
          flutter pub add supabase_flutter:2.18.3
          flutter pub add maplibre_gl:0.27.1
          flutter pub add latlong2
          flutter pub add google_fonts
          flutter pub add flutter_svg
          flutter pub add url_launcher
          flutter pub add file_picker
          flutter pub add geolocator
          flutter pub add image_picker
          flutter pub add csv
          # Pin the permission plugin to the Android-36-compatible release line.
          flutter pub add permission_handler:12.0.3
          flutter pub add http
          flutter pub add crypto:3.0.8
          flutter pub add shared_preferences
          flutter pub add webview_flutter
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          content = path.read_text()
          if "dependency_overrides:" not in content:
              content += chr(10) + "dependency_overrides:" + chr(10) + "  permission_handler_android: 13.0.1" + chr(10)

          asset_entry = "    - assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson"
          if asset_entry not in content:
              if chr(10) + "flutter:" + chr(10) not in content:
                  raise SystemExit("Flutter section not found in generated pubspec.yaml")
              content = content.replace(
                  chr(10) + "flutter:" + chr(10),
                  chr(10) + "flutter:" + chr(10) + "  assets:" + chr(10) + asset_entry + chr(10),
                  1,
              )

          groundwater_entry = "    - assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson"
          brand_entries = [
              "    - assets/brand/samanvay_logo.jpg",
              "    - assets/brand/samanvay_logo.png",
              "    - assets/brand/home_city_banner.jpg",
              "    - assets/brand/profile_avatar.jpg",
              "    - assets/brand/profile_footer.jpg",
              "    - assets/brand/splash_city.jpg",
              "    - assets/brand/samanvay_city_background.svg",
              "    - assets/brand/samanvay_home_banner.svg",
              "    - assets/brand/samanvay_profile_footer.svg",
              "    - assets/brand/samanvay_logo.svg",
              "    - assets/brand/samanvay_profile_avatar.svg",
              "    - assets/cutaway/",
          ]
          if groundwater_entry not in content:
              if asset_entry not in content:
                  raise SystemExit("Coimbatore ward asset entry not found")
              content = content.replace(
                  asset_entry,
                  asset_entry + chr(10) + groundwater_entry,
                  1,
              )
          for brand_entry in brand_entries:
              if brand_entry not in content:
                  content = content.replace(groundwater_entry, groundwater_entry + chr(10) + brand_entry, 1)
                  groundwater_entry = brand_entry
          path.write_text(content)
          PY
          echo "Verifying Flutter asset declarations before build..."
          grep -F "assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson" pubspec.yaml
          grep -F "assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson" pubspec.yaml
          grep -F "assets/cutaway/" pubspec.yaml
          test -s assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson
          test -s assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson
          flutter pub get

      # 6. Check Dart code
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 6b. Persistent release signing (opt-in). Without these secrets the APK is
      # signed with CI's temporary debug key, which changes between runs and
      # blocks in-place upgrades (users must uninstall, losing app data).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] \
             || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Release keystore secrets are not configured; this APK is debug-signed and cannot upgrade a build signed by a different run."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          python3 - <<'PY2'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text()
          debug_line = 'signingConfig = signingConfigs.getByName("debug")'
          if content.count(debug_line) != 1 or content.count("    buildTypes {") != 1:
              raise SystemExit("ERROR: Unexpected Gradle layout; release signing was not applied.")
          signing = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            storeFile = file(\"upload-keystore.jks\")\n"
              "            storePassword = System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
              "            keyAlias = System.getenv(\"ANDROID_KEY_ALIAS\")\n"
              "            keyPassword = System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n\n"
          )
          content = content.replace("    buildTypes {", signing + "    buildTypes {", 1)
          content = content.replace(debug_line, 'signingConfig = signingConfigs.getByName("release")', 1)
          gradle.write_text(content)
          print("PASS: release signing configured from repository secrets.")
          PY2

      # 7. Build one universal APK. The app runs entirely on the device, so no
      # backend secrets are needed.
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$SOURCE" || { echo "ERROR: APK was not generated."; exit 1; }
          mkdir -p dist
          cp "$SOURCE" dist/SAMANVAY.apk
          ls -lh dist/SAMANVAY.apk
          sha256sum dist/SAMANVAY.apk

      # 9. APK checks are required; failures fail the build
      - name: Verify APK package, signature and alignment
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools unavailable."
            exit 1
          fi

          for APK in dist/*.apk; do
            echo "========== VERIFYING $APK =========="
            file "$APK"
            unzip -t "$APK" >/dev/null
            "$BUILD_TOOLS/aapt" dump badging "$APK"
            PACKAGE_NAME="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            EXPECTED_PACKAGE="org.samanvay.samanvay"
            if [ "$PACKAGE_NAME" != "$EXPECTED_PACKAGE" ]; then
              echo "ERROR: Unexpected APK package name: $PACKAGE_NAME"
              exit 1
            fi
            echo "PASS: APK package name is $PACKAGE_NAME"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

            for REQUIRED_ASSET in \
              "assets/flutter_assets/assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson" \
              "assets/flutter_assets/assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson" \
              "assets/flutter_assets/assets/brand/samanvay_logo.jpg" \
              "assets/flutter_assets/assets/brand/samanvay_logo.png" \
              "assets/flutter_assets/assets/brand/home_city_banner.jpg" \
              "assets/flutter_assets/assets/brand/profile_avatar.jpg" \
              "assets/flutter_assets/assets/brand/profile_footer.jpg" \
              "assets/flutter_assets/assets/brand/splash_city.jpg" \
              "assets/flutter_assets/assets/brand/samanvay_city_background.svg" \
              "assets/flutter_assets/assets/brand/samanvay_home_banner.svg" \
              "assets/flutter_assets/assets/brand/samanvay_profile_footer.svg" \
              "assets/flutter_assets/assets/brand/samanvay_logo.svg" \
              "assets/flutter_assets/assets/brand/samanvay_profile_avatar.svg"; do
              if ! unzip -l "$APK" | grep -Fq "$REQUIRED_ASSET"; then
                echo "ERROR: Required GIS data asset missing from APK: $REQUIRED_ASSET"
                exit 1
              fi
              echo "Verified GIS data asset in APK: $REQUIRED_ASSET"
            done
          done

      # 10. Upload the APK
      - name: Upload APK download
        if: always() && hashFiles('dist/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAMANVAY-APK
          path: dist/SAMANVAY.apk
          if-no-files-found: error
          retention-days: 30

      # 10b. Direct download: attach the APK itself (not a zip) to a release
      # so it can be downloaded and installed straight from a phone.
      - name: Publish direct APK download
        if: hashFiles('dist/SAMANVAY.apk') != '' && startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-app-latest
          name: SAMANVAY app (latest build)
          target_commitish: ${{ github.sha }}
          body: |
            Download SAMANVAY.apk below and open it on your Android phone to install.
            The app runs entirely on the device: no account, no server.
            Built from commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/SAMANVAY.apk

      # 11. Publish/update the Alpha 0.3 prerelease on successful builds
      # Branch builds (e.g. claude/**) only upload artifacts; they never overwrite the release.
      - name: Publish SAMANVAY Alpha 0.3
        if: >-
          hashFiles('dist/*.apk') != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/feature/alpha-03-integrated-platform')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-alpha-0.3
          name: SAMANVAY Alpha 0.3
          body: |
            SAMANVAY Android Application
            Version: Alpha 0.3

            Includes:
            - One universal Android APK (SAMANVAY.apk)
            - Runs entirely on the device: no account, no server
            - Roles: citizen, department officer, coordinator, administrator
            - Department checklists, three-part screening (spatial, data confidence, dig-once)
            - Manaparai Bus Stand utility map with sample records, scale bar, north arrow and map metadata
            - Works, decisions and reports are saved on the device

            Note: utility records on the map are sample data for Manaparai Bus Stand, not a survey.

          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*.apk
